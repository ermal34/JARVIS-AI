<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at center, #10243b 0%, #05080d 45%, #010204 100%);
    color: #00d9ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,217,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,.04) 1px, transparent 1px);
    background-size: 35px 35px;
    pointer-events: none;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid rgba(0,217,255,.25);
    background: rgba(0,0,0,.45);
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 5px;
}

.status {
    color: #00ff88;
    font-size: 14px;
}

.status::before {
    content: "●";
    margin-right: 8px;
}

main {
    height: calc(100vh - 75px);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.core {
    margin-top: 35px;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.core::before,
.core::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 2px solid #00d9ff;
    animation: pulse 2.5s infinite;
}

.core::before {
    inset: 15px;
    box-shadow: 0 0 30px #00d9ff;
}

.core::after {
    inset: 35px;
    border-color: #008cff;
    animation-delay: .6s;
}

.core-inner {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #00d9ff;
    box-shadow:
        0 0 20px #00d9ff,
        0 0 60px #0077ff;
    animation: glow 1.5s infinite alternate;
}

@keyframes pulse {
    0% {
        transform: scale(.85);
        opacity: .9;
    }
    100% {
        transform: scale(1.15);
        opacity: .1;
    }
}

@keyframes glow {
    from {
        opacity: .6;
    }
    to {
        opacity: 1;
    }
}

#output {
    width: min(900px, 92%);
    height: 35vh;
    margin-top: 25px;
    padding: 18px;
    overflow-y: auto;
    border: 1px solid rgba(0,217,255,.25);
    border-radius: 18px;
    background: rgba(0,0,0,.45);
    box-shadow: inset 0 0 30px rgba(0,217,255,.04);
}

.message {
    margin: 9px 0;
    line-height: 1.5;
}

.user {
    color: #ffffff;
}

.jarvis {
    color: #00d9ff;
}

.system {
    color: #00ff88;
}

.controls {
    width: min(900px, 92%);
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #00d9ff;
    background: rgba(0,0,0,.7);
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    padding: 13px 18px;
    border-radius: 12px;
    border: 1px solid #00d9ff;
    background: rgba(0,120,180,.2);
    color: #00d9ff;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: rgba(0,217,255,.2);
    box-shadow: 0 0 15px rgba(0,217,255,.4);
}

#mic {
    width: 58px;
    font-size: 22px;
}

.commands {
    margin-top: 12px;
    color: #6f9bab;
    font-size: 12px;
    text-align: center;
    max-width: 900px;
}
</style>
</head>

<body>

<header>
    <div class="logo">JARVIS</div>
    <div class="status">ONLINE</div>
</header>

<main>

    <div class="core">
        <div class="core-inner"></div>
    </div>

    <div id="output"></div>

    <div class="controls">
        <input
            id="input"
            type="text"
            placeholder="Befehl an JARVIS..."
            autocomplete="off">

        <button id="send">SEND</button>
        <button id="mic">🎙️</button>
    </div>

    <div class="commands">
        Befehle: Hilfe · Uhrzeit · Datum · Google · Bilder ·
        YouTube · Suche · Rechner · Sprich · Stopp · Status · Löschen
    </div>

</main>

<script>

const output = document.getElementById("output");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
}

function speak(text) {
    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);
    voice.lang = "de-DE";
    voice.rate = 1;
    voice.pitch = 1;

    speechSynthesis.speak(voice);
}

function jarvis(text) {
    addMessage("JARVIS: " + text, "jarvis");
    speak(text);
}

function openGoogle(query) {
    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
    );
}

function openImages(query) {
    window.open(
        "https://www.google.com/search?tbm=isch&q=" +
        encodeURIComponent(query),
        "_blank"
    );
}

function openYouTube(query) {
    window.open(
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query),
        "_blank"
    );
}

function calculate(expression) {

    try {

        const safe = expression
            .replace(/,/g, ".")
            .replace(/×/g, "*")
            .replace(/÷/g, "/");

        if (!/^[0-9+\-*/().%\s]+$/.test(safe)) {
            jarvis("Diese Rechnung kann ich nicht sicher auswerten.");
            return;
        }

        const result = Function(
            '"use strict"; return (' + safe + ")"
        )();

        jarvis("Das Ergebnis ist " + result);

    } catch {
        jarvis("Ich konnte diese Rechnung nicht berechnen.");
    }
}

function help() {

    const text =
        "Meine verfügbaren Befehle sind: " +
        "Uhrzeit, Datum, Google, Bilder, YouTube, Suche, " +
        "Rechner, Sprich, Stopp, Status, Löschen und Hallo.";

    jarvis(text);
}

function processCommand(command) {

    const original = command.trim();
    const text = original.toLowerCase();

    if (!text) return;

    addMessage("DU: " + original, "user");

    if (
        text === "hallo" ||
        text === "hi" ||
        text.includes("hey jarvis")
    ) {
        jarvis("Hallo. Ich bin bereit.");
        return;
    }

    if (
        text === "hilfe" ||
        text === "befehle" ||
        text === "was kannst du"
    ) {
        help();
        return;
    }

    if (text === "uhrzeit" || text.includes("wie spät")) {

        const time = new Date().toLocaleTimeString(
            "de-DE",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

        jarvis("Es ist " + time + " Uhr.");
        return;
    }

    if (text === "datum" || text.includes("welcher tag")) {

        const date = new Date().toLocaleDateString(
            "de-DE",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

        jarvis("Heute ist " + date + ".");
        return;
    }

    if (text.startsWith("google ")) {

        const query = original.substring(7);

        jarvis("Ich suche bei Google nach " + query + ".");
        openGoogle(query);
        return;
    }

    if (text.startsWith("bilder ")) {

        const query = original.substring(7);

        jarvis("Ich suche Bilder zu " + query + ".");
        openImages(query);
        return;
    }

    if (text.startsWith("youtube ")) {

        const query = original.substring(8);

        jarvis("Ich suche auf YouTube nach " + query + ".");
        openYouTube(query);
        return;
    }

    if (text.startsWith("suche ")) {

        const query = original.substring(6);

        jarvis("Ich starte eine Websuche nach " + query + ".");
        openGoogle(query);
        return;
    }

    if (text.startsWith("rechner ")) {

        const expression = original.substring(8);

        calculate(expression);
        return;
    }

    if (text.startsWith("sprich ")) {

        const message = original.substring(7);

        jarvis(message);
        return;
    }

    if (
        text === "stopp" ||
        text === "stop" ||
        text === "ruhe"
    ) {

        speechSynthesis.cancel();
        addMessage("JARVIS: Sprachwiedergabe gestoppt.", "system");
        return;
    }

    if (text === "löschen" || text === "clear") {

        output.innerHTML = "";
        jarvis("Verlauf gelöscht.");
        return;
    }

    if (text === "status") {

        jarvis(
            "Alle grundlegenden JARVIS-Systeme sind online. " +
            "Sprachsteuerung und Webbefehle sind verfügbar."
        );

        return;
    }

    if (text.includes("wer bist du")) {

        jarvis(
            "Ich bin JARVIS, dein persönlicher KI-Assistent."
        );

        return;
    }

    if (text.includes("körperteile")) {

        jarvis(
            "Ich kann dir dabei helfen. " +
            "Ich öffne eine Bildersuche zu den menschlichen Körperteilen."
        );

        openImages("menschliche Körperteile Anatomie");
        return;
    }

    jarvis(
        "Diesen Befehl kenne ich noch nicht. " +
        "Sag Hilfe, um meine verfügbaren Befehle zu sehen."
    );
}

send.addEventListener("click", () => {
    processCommand(input.value);
    input.value = "";
    input.focus();
});

input.addEventListener("keydown", event => {

    if (event.key === "Enter") {

        processCommand(input.value);
        input.value = "";
    }
});

/* SPRACHERKENNUNG */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition = new SpeechRecognition();

    recognition.lang = "de-DE";
    recognition.continuous = false;
    recognition.interimResults = false;

    mic.addEventListener("click", () => {

        recognition.start();

        mic.textContent = "🔴";
        addMessage(
            "System: Ich höre zu...",
            "system"
        );
    });

    recognition.onresult = event => {

        const text =
            event.results[0][0].transcript;

        input.value = text;

        processCommand(text);

        input.value = "";
    };

    recognition.onend = () => {
        mic.textContent = "🎙️";
    };

    recognition.onerror = () => {
        mic.textContent = "🎙️";

        addMessage(
            "System: Sprachsteuerung konnte nicht gestartet werden.",
            "system"
        );
    };

} else {

    mic.disabled = true;

    addMessage(
        "System: Dieser Browser unterstützt die Sprachsteuerung nicht.",
        "system"
    );
}

/* START */

addMessage(
    "JARVIS-System gestartet. Warte auf Befehl.",
    "system"
);

jarvis(
    "System online. Wie kann ich dir helfen?"
);

</script>

</body>
</html>
