<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #10243b 0%, #05080d 45%, #010204 100%);
  color: #00d9ff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.app {
  width: 100%;
  max-width: 900px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

header {
  text-align: center;
  padding: 15px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 5px;
  text-shadow: 0 0 20px #00d9ff;
}

.status {
  margin-top: 8px;
  font-size: 14px;
  color: #55ff99;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  border: 1px solid #075b76;
  border-radius: 20px;
  background: rgba(0, 10, 20, 0.65);
  box-shadow: 0 0 25px rgba(0, 217, 255, 0.12);
}

.message {
  margin: 12px 0;
  padding: 12px 15px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.5;
}

.system {
  background: rgba(0, 217, 255, 0.08);
  border-left: 3px solid #00d9ff;
}

.user {
  margin-left: auto;
  background: rgba(0, 120, 255, 0.18);
  border-right: 3px solid #008cff;
  color: white;
}

.controls {
  display: flex;
  gap: 10px;
  padding-top: 15px;
}

input {
  flex: 1;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #08718d;
  background: #050b12;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  border: 1px solid #008db0;
  background: #061923;
  color: #00d9ff;
  border-radius: 12px;
  padding: 12px 17px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #0b3040;
}

.mic {
  font-size: 22px;
  width: 55px;
}

.mic.active {
  background: #a00000;
  color: white;
}

.quick {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-top: 10px;
}

.quick button {
  white-space: nowrap;
  font-size: 13px;
}

::-webkit-scrollbar {
  width: 5px;
}

::-webkit-scrollbar-thumb {
  background: #08718d;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">JARVIS</div>
  <div class="status" id="status">● SYSTEM ONLINE</div>
</header>

<div id="chat"></div>

<div class="quick">
  <button onclick="processCommand('hilfe')">Hilfe</button>
  <button onclick="processCommand('uhrzeit')">Uhrzeit</button>
  <button onclick="processCommand('datum')">Datum</button>
  <button onclick="processCommand('status')">Status</button>
  <button onclick="processCommand('stop')">Stop</button>
  <button onclick="processCommand('löschen')">Löschen</button>
</div>

<div class="controls">
  <input
    id="input"
    type="text"
    placeholder="Befehl an JARVIS..."
    autocomplete="off"
  >

  <button class="mic" id="mic">🎙️</button>
  <button id="send">Senden</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const statusText = document.getElementById("status");

function addMessage(text, type = "system") {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "de-DE";
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

function jarvis(text) {

  addMessage("JARVIS: " + text, "system");

  speak(text);
}

function stopSpeaking() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  addMessage("JARVIS: Sprachwiedergabe gestoppt.", "system");
}

function getTime() {

  return new Date().toLocaleTimeString(
    "de-DE",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function getDate() {

  return new Date().toLocaleDateString(
    "de-DE",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );
}

function openGoogle(query) {

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(query),
    "_blank"
  );
}

function openYouTube(query) {

  window.open(
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(query),
    "_blank"
  );
}

function openImages(query) {

  window.open(
    "https://www.google.com/search?tbm=isch&q=" +
    encodeURIComponent(query),
    "_blank"
  );
}

function processCommand(command) {

  if (!command) return;

  const original = command.trim();

  const text = original
    .toLowerCase()
    .trim();

  addMessage(original, "user");

  input.value = "";

  if (text === "stop" ||
      text === "stopp" ||
      text === "ruhe") {

    stopSpeaking();
    return;
  }

  if (text === "löschen" ||
      text === "clear") {

    chat.innerHTML = "";

    jarvis("Verlauf gelöscht.");

    return;
  }

  if (text === "status") {

    jarvis(
      "Alle grundlegenden JARVIS-Systeme sind online. " +
      "Sprachsteuerung und Webbefehle sind verfügbar."
    );

    return;
  }

  if (
    text === "hilfe" ||
    text === "befehle" ||
    text === "was kannst du"
  ) {

    jarvis(
      "Du kannst zum Beispiel sagen: " +
      Uhrzeit, Datum, Status, Google gefolgt von deiner Suche, " +
      YouTube gefolgt von deiner Suche, Bilder gefolgt von deiner Suche, " +
      sprich gefolgt von einem Satz oder Stopp."
    );

    return;
  }

  if (
    text === "wer bist du" ||
    text.includes("wie heißt du")
  ) {

    jarvis(
      "Ich bin JARVIS, dein persönlicher KI-Assistent."
    );

    return;
  }

  if (
    text === "hallo" ||
    text === "hi" ||
    text === "hey" ||
    text.includes("hallo jarvis")
  ) {

    jarvis("Hallo! Ich bin bereit. Wie kann ich dir helfen?");

    return;
  }

  if (
    text === "uhrzeit" ||
    text.includes("wie spät")
  ) {

    jarvis(
      "Es ist " + getTime() + " Uhr."
    );

    return;
  }

  if (
    text === "datum" ||
    text === "welcher tag ist heute"
  ) {

    jarvis(
      "Heute ist " + getDate() + "."
    );

    return;
  }

  if (text.startsWith("sprich ")) {

    const message = original.substring(7);

    jarvis(message);

    return;
  }

  if (text.startsWith("google ")) {

    const query = original.substring(7);

    jarvis(
      "Ich suche bei Google nach " + query + "."
    );

    openGoogle(query);

    return;
  }

  if (text.startsWith("suche ")) {

    const query = original.substring(6);

    jarvis(
      "Ich starte eine Suche nach " + query + "."
    );

    openGoogle(query);

    return;
  }

  if (text.startsWith("youtube ")) {

    const query = original.substring(8);

    jarvis(
      "Ich suche auf YouTube nach " + query + "."
    );

    openYouTube(query);

    return;
  }

  if (text.startsWith("bilder ")) {

    const query = original.substring(7);

    jarvis(
      "Ich suche Bilder zu " + query + "."
    );

    openImages(query);

    return;
  }

  if (text.includes("danke")) {

    jarvis("Sehr gerne.");

    return;
  }

  jarvis(
    "Diesen Befehl kenne ich noch nicht. " +
    "Sag einfach Hilfe, um meine verfügbaren Befehle zu sehen."
  );
}


/* SENDEN */

send.addEventListener("click", () => {

  processCommand(input.value);

  input.focus();

});


/* ENTER */

input.addEventListener("keydown", event => {

  if (event.key === "Enter") {

    processCommand(input.value);

  }

});


/* SPRACHERKENNUNG */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  const recognition = new SpeechRecognition();

  recognition.lang = "de-DE";

  recognition.continuous = false;

  recognition.interimResults = false;

  mic.addEventListener("click", () => {

    try {

      recognition.start();

      mic.classList.add("active");

      statusText.textContent =
        "● JARVIS HÖRT ZU...";

      addMessage(
        "System: Ich höre zu...",
        "system"
      );

    } catch (error) {

      console.log(error);

    }

  });


  recognition.onresult = event => {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    processCommand(text);

  };


  recognition.onend = () => {

    mic.classList.remove("active");

    statusText.textContent =
      "● SYSTEM ONLINE";

  };


  recognition.onerror = event => {

    mic.classList.remove("active");

    statusText.textContent =
      "● SYSTEM ONLINE";

    addMessage(
      "System: Sprachsteuerung konnte nicht gestartet werden.",
      "system"
    );

  };

} else {

  mic.disabled = true;

  addMessage(
    "System: Dieser Browser unterstützt keine Sprachsteuerung.",
    "system"
  );

}


/* START */

addMessage(
  "JARVIS-System gestartet. Warte auf Befehl.",
  "system"
);

jarvis(
  "System online. Wie kann ich dir helfen?"
);

input.focus();

</script>

</body>
</html>
